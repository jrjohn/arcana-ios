# SwiftLint Configuration for Arcana iOS

# Paths to include during linting
included:
  - Sources
  - Tests

# Paths to ignore during linting
excluded:
  - .build
  - .swiftpm
  - Pods
  - Carthage
  - vendor

# Rules to disable
disabled_rules:
  - trailing_whitespace
  - todo
  - identifier_name

# Rules to enable
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - file_header
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

type_name:
  min_length: 3
  max_length: 40

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - id
    - URL
    - url

# Custom rules
custom_rules:
  no_print:
    name: "Print Usage"
    regex: "print\\("
    message: "Use Logger instead of print()"
    severity: warning
  
  no_force_cast:
    name: "Force Cast"
    regex: "as!"
    message: "Avoid force casting, use optional binding or guard"
    severity: error
  
  no_force_try:
    name: "Force Try"
    regex: "try!"
    message: "Avoid force try, handle errors properly"
    severity: error

# Reporter type
reporter: "xcode"
